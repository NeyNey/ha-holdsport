name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd custom_components/holdsport && zip -r ../../holdsport.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: holdsport.zip
          generate_release_notes: true
